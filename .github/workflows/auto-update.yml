name: Auto Update

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      bump:
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      force:
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      publish:
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  issues: write

concurrency:
  group: elaina-baileys-auto-release
  cancel-in-progress: false

jobs:
  update:
    name: Update & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Show environment
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Update WhatsApp artifacts (waupdate / updatewa / syncproto)
        id: wa_update
        run: |
          node ./script/waupdate.js --apply --keep 2 || true
          node ./script/updatewa.js
          node ./script/syncproto.js

      - name: Verify proto
        id: verify_proto
        continue-on-error: true
        run: |
          out=$(node ./script/verifyproto.js 2>&1 || true)
          echo "verify_output<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$out"

      - name: Report proto verification failures and close resolved issue
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OUTPUT: ${{ steps.verify_proto.outputs.verify_output }}
        with:
          script: |
            const out = process.env.VERIFY_OUTPUT || ''
            const lines = out.split(/\r?\n/)
            const roundLine = lines.find(l => l.startsWith('Round-tripped')) || ''
            const failureStartIndex = lines.findIndex(l => l.includes('fields failed:'))
            const failures = []
            if (failureStartIndex >= 0) {
              for (let i = failureStartIndex + 1; i < lines.length; i++) {
                const line = lines[i].trim()
                if (!line) continue
                if (line.startsWith('- ') || line.startsWith('  - ')) failures.push(line.replace(/^(-|\s*-\s+)/, '- '))
                else break
              }
            }
            const owner = context.repo.owner
            const repo = context.repo.repo
            const labels = ['verifyproto-failure']
            const title = 'verifyproto: protobuf roundtrip failures'
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: labels.join(','),
              per_page: 100
            })
            const existing = issues.find(issue => issue.title === title)
            if (failures.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `Verification passed on ${new Date().toISOString().slice(0,10)}. Closing issue.`
                })
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed'
                })
              }
              return
            }
            const body = [
              roundLine || `Checked: n/a`,
              '',
              ...failures
            ].join('\n')
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              })
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'open'
              }).catch(() => {})
              return
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels
            })

      - name: Update WhatsApp version (update files that track WA revision)
        run: npm run update:version

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tidak ada perubahan WhatsApp yang terdeteksi."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Perubahan WhatsApp terdeteksi."
            git diff --staged --stat
          fi

      - name: Stop if no changes
        if: steps.changes.outputs.changed == 'false' && github.event.inputs.force != 'true'
        run: |
          echo "Tidak ada perubahan dan force=false."
          echo "Release dilewati."

      - name: Bump package version
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force == 'true'
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const pkgPath = './package.json'
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          const currentRaw = String(pkg.version ?? '').trim()
          const bump = (process.env.BUMP || 'patch').trim().toLowerCase()

          if (!currentRaw) {
            throw new Error('package.json version is empty')
          }

          function normalize(version) {
            let v = String(version ?? '').trim()
            if (!v) throw new Error('Version is empty')
            if (v.startsWith('v')) v = v.slice(1)
            return v
          }

          function parse(version) {
            const v = normalize(version)
            const match = v.match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+([0-9A-Za-z.-]+))?$/)
            if (!match) throw new Error(`Unsupported version format: ${version}`)
            return {
              major: Number(match[1]),
              minor: Number(match[2]),
              patch: Number(match[3]),
              pre: match[4] ?? null,
              build: match[5] ?? null
            }
          }

          function bumpVersion(version, type) {
            const v = parse(version)
            const t = ['major', 'minor', 'patch'].includes(type) ? type : 'patch'

            if (t === 'major') return `${v.major + 1}.0.0`
            if (t === 'minor') return `${v.major}.${v.minor + 1}.0`

            if (v.pre) {
              const parts = v.pre.split('.')
              const last = parts[parts.length - 1]
              const nextPre = /^\d+$/.test(last) ? Number(last) + 1 : 1
              parts[parts.length - 1] = String(nextPre)
              return `${v.major}.${v.minor}.${v.patch}-${parts.join('.')}`
            }

            return `${v.major}.${v.minor}.${v.patch + 1}`
          }

          const next = bumpVersion(currentRaw, bump)
          pkg.version = next
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')
          console.log(`Version: ${currentRaw} -> ${next}`)
          NODE

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p 'require("./package.json").version')
          git add -A
          git commit -m "chore: release v${VERSION} — WA update $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git pull --rebase origin main || true
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} sudah ada."
          else
            git tag "v${VERSION}"
          fi
          git push origin main || true
          git push origin "v${VERSION}" || true

      - name: Publish to NPM
        if: >
          (steps.changes.outputs.changed == 'true' || github.event.inputs.force == 'true')
          && github.event_name == 'workflow_dispatch'
          && github.event.inputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          PACKAGE_NAME="@rexxhayanasi/elaina-baileys"

          echo "Preparing ${PACKAGE_NAME}@${VERSION}"

          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is missing. Skipping publish."
            exit 0
          fi

          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} sudah tersedia di NPM."
            exit 0
          fi

          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"

          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | cut -d'-' -f2 | cut -d'.' -f1)
            echo "Publishing prerelease dengan npm tag: ${TAG}"
            npm publish --access public --tag "${TAG}"
          else
            echo "Publishing stable release dengan npm tag: latest"
            npm publish --access public
          fi

          echo "Published ${PACKAGE_NAME}@${VERSION}"

      - name: Summary
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force == 'true'
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "### Elaina Baileys Auto Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`@rexxhayanasi/elaina-baileys\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node.js: \`24\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | cut -d'-' -f2 | cut -d'.' -f1)
            echo "- NPM tag: \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- NPM tag: \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "- Publish allowed (manual): \`true\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "- Publish allowed (manual): \`false\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Publish allowed (auto run): \`true\`" >> "$GITHUB_STEP_SUMMARY"
          fi
